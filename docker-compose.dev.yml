services:
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:2.27.0
    container_name: temporal-ui
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  postgres:
    image: postgres:13
    container_name: temporal-postgres
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:1.106.4@sha256:c169fb3adc514fcf210377c203f3de406d54f10bfdacf13948a4a839db9af7de}
    restart: unless-stopped
    init: true
    command: ["--config=/app/config.yaml", "--host=0.0.0.0", "--port=4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before starting the stack}
      LITELLM_MODEL: ${LITELLM_MODEL:-ollama_chat/llama3.1:8b}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://host.docker.internal:11434}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-ollama}
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-copilot-worker
    restart: unless-stopped
    command: python apps/worker/main.py
    environment:
      IC_TEMPORAL_HOST: temporal:7233
      IC_TEMPORAL_NAMESPACE: default
      IC_TEMPORAL_TASK_QUEUE: incident-copilot
      IC_CONTROL_DB_PATH: /app/data/control.db
      IC_DATA_DIR: /app/data/artifacts
      IC_INDEX_DB_PATH: /app/data/indexes/repo_index.db
      IC_REPOSITORY_CACHE_DIR: /repository-cache
      IC_TREE_SITTER_ENABLED: ${IC_TREE_SITTER_ENABLED:-true}
      IC_AGENTIC_ENABLED: ${IC_AGENTIC_ENABLED:-false}
      IC_AGENTIC_MAX_ROUNDS: ${IC_AGENTIC_MAX_ROUNDS:-3}
      IC_AGENTIC_MAX_TOOL_REQUESTS: ${IC_AGENTIC_MAX_TOOL_REQUESTS:-12}
      IC_AGENTIC_TIMEOUT_SECONDS: ${IC_AGENTIC_TIMEOUT_SECONDS:-180}
      IC_GUARDRAILS_MODE: ${IC_GUARDRAILS_MODE:-observe}
      IC_GUARDRAILS_TIMEOUT_SECONDS: ${IC_GUARDRAILS_TIMEOUT_SECONDS:-10}
      IC_CODE_GRAPH_ENABLED: ${IC_CODE_GRAPH_ENABLED:-true}
      IC_CODE_GRAPH_MODE: ${IC_CODE_GRAPH_MODE:-managed}
      IC_CODE_GRAPH_PREPARE_TIMEOUT_SECONDS: ${IC_CODE_GRAPH_PREPARE_TIMEOUT_SECONDS:-300}
      IC_GITNEXUS_URL: ${IC_GITNEXUS_DOCKER_URL:-http://gitnexus:3111/mcp}
      IC_GITNEXUS_AUTH_TOKEN_FILE: /run/codegraph-auth/token
      IC_GITNEXUS_REPOSITORY: ${IC_GITNEXUS_REPOSITORY:-}
      IC_GITNEXUS_AUTH_TOKEN: ${IC_GITNEXUS_AUTH_TOKEN:-}
      IC_LLM_PROVIDER: ${IC_LLM_PROVIDER:-openai_compatible}
      IC_OLLAMA_BASE_URL: ${IC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IC_OLLAMA_MODEL: ${IC_OLLAMA_MODEL:-llama3.1:8b}
      IC_OPENAI_COMPATIBLE_BASE_URL: ${IC_OPENAI_COMPATIBLE_BASE_URL:-http://litellm:4000/v1}
      IC_OPENAI_COMPATIBLE_MODEL: ${IC_OPENAI_COMPATIBLE_MODEL:-incident-diagnosis}
      IC_OPENAI_COMPATIBLE_API_KEY: ${IC_OPENAI_COMPATIBLE_API_KEY:-${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before starting the stack}}
    volumes:
      - ./data:/app/data
      - repository-cache:/repository-cache
      - ${IC_REPOSITORIES_DIR:-.}:/repositories:ro
      - gitnexus-auth:/run/codegraph-auth:ro
    depends_on:
      temporal:
        condition: service_started
      litellm:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-copilot-api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IC_LOG_INGEST_TOKEN: ${IC_LOG_INGEST_TOKEN:-}
      IC_CONTROL_DB_PATH: /app/data/control.db
      IC_DATA_DIR: /app/data/artifacts
      IC_INDEX_DB_PATH: /app/data/indexes/repo_index.db
      IC_REPOSITORY_CACHE_DIR: /repository-cache
      IC_TREE_SITTER_ENABLED: ${IC_TREE_SITTER_ENABLED:-true}
      IC_AGENTIC_ENABLED: ${IC_AGENTIC_ENABLED:-false}
      IC_AGENTIC_MAX_ROUNDS: ${IC_AGENTIC_MAX_ROUNDS:-3}
      IC_AGENTIC_MAX_TOOL_REQUESTS: ${IC_AGENTIC_MAX_TOOL_REQUESTS:-12}
      IC_AGENTIC_TIMEOUT_SECONDS: ${IC_AGENTIC_TIMEOUT_SECONDS:-180}
      IC_GUARDRAILS_MODE: ${IC_GUARDRAILS_MODE:-observe}
      IC_GUARDRAILS_TIMEOUT_SECONDS: ${IC_GUARDRAILS_TIMEOUT_SECONDS:-10}
      IC_TEMPORAL_HOST: temporal:7233
      IC_TEMPORAL_NAMESPACE: default
      IC_TEMPORAL_TASK_QUEUE: incident-copilot
      IC_CODE_GRAPH_ENABLED: ${IC_CODE_GRAPH_ENABLED:-true}
      IC_CODE_GRAPH_MODE: ${IC_CODE_GRAPH_MODE:-managed}
      IC_CODE_GRAPH_PREPARE_TIMEOUT_SECONDS: ${IC_CODE_GRAPH_PREPARE_TIMEOUT_SECONDS:-300}
      IC_GITNEXUS_URL: ${IC_GITNEXUS_DOCKER_URL:-http://gitnexus:3111/mcp}
      IC_GITNEXUS_AUTH_TOKEN_FILE: /run/codegraph-auth/token
      IC_GITNEXUS_REPOSITORY: ${IC_GITNEXUS_REPOSITORY:-}
      IC_GITNEXUS_AUTH_TOKEN: ${IC_GITNEXUS_AUTH_TOKEN:-}
      IC_LLM_PROVIDER: ${IC_LLM_PROVIDER:-openai_compatible}
      IC_OLLAMA_BASE_URL: ${IC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IC_OLLAMA_MODEL: ${IC_OLLAMA_MODEL:-llama3.1:8b}
      IC_OPENAI_COMPATIBLE_BASE_URL: ${IC_OPENAI_COMPATIBLE_BASE_URL:-http://litellm:4000/v1}
      IC_OPENAI_COMPATIBLE_MODEL: ${IC_OPENAI_COMPATIBLE_MODEL:-incident-diagnosis}
      IC_OPENAI_COMPATIBLE_API_KEY: ${IC_OPENAI_COMPATIBLE_API_KEY:-${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before starting the stack}}
    volumes:
      - ./data:/app/data
      - repository-cache:/repository-cache:ro
      - ${IC_REPOSITORIES_DIR:-.}:/repositories:ro
      - gitnexus-auth:/run/codegraph-auth:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      temporal:
        condition: service_started
      litellm:
        condition: service_healthy

  gitnexus:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: apps/codegraph/Dockerfile
    environment:
      GITNEXUS_REPO_ROOT: ${IC_GITNEXUS_REPOSITORY:-/repositories}
      GITNEXUS_MCP_AUTH_TOKEN: ${IC_GITNEXUS_AUTH_TOKEN:-}
      IC_REPOSITORY_CACHE_DIR: /repository-cache
    ports:
      - "127.0.0.1:3111:3111"
    volumes:
      - ${IC_REPOSITORIES_DIR:-.}:/repositories:ro
      - gitnexus-state:/state
      - repository-cache:/repository-cache:ro
      - gitnexus-auth:/run/codegraph-auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3111/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repository-cache:
  gitnexus-state:
  gitnexus-auth:
