services:
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:2.27.0
    container_name: temporal-ui
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  postgres:
    image: postgres:13
    container_name: temporal-postgres
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-copilot-worker
    restart: unless-stopped
    command: python apps/worker/main.py
    environment:
      IC_TEMPORAL_HOST: temporal:7233
      IC_TEMPORAL_NAMESPACE: default
      IC_TEMPORAL_TASK_QUEUE: incident-copilot
      IC_CONTROL_DB_PATH: /app/data/control.db
      IC_DATA_DIR: /app/data/artifacts
      IC_INDEX_DB_PATH: /app/data/indexes/repo_index.db
      IC_TREE_SITTER_ENABLED: ${IC_TREE_SITTER_ENABLED:-true}
      IC_LLM_PROVIDER: ollama
      IC_OLLAMA_BASE_URL: ${IC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IC_OLLAMA_MODEL: ${IC_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./data:/app/data
      - ${IC_REPOSITORIES_DIR:-.}:/repositories:ro
    depends_on:
      temporal:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-copilot-api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IC_CONTROL_DB_PATH: /app/data/control.db
      IC_DATA_DIR: /app/data/artifacts
      IC_INDEX_DB_PATH: /app/data/indexes/repo_index.db
      IC_TREE_SITTER_ENABLED: ${IC_TREE_SITTER_ENABLED:-true}
      IC_TEMPORAL_HOST: temporal:7233
      IC_TEMPORAL_NAMESPACE: default
      IC_TEMPORAL_TASK_QUEUE: incident-copilot
      IC_LLM_PROVIDER: ollama
      IC_OLLAMA_BASE_URL: ${IC_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IC_OLLAMA_MODEL: ${IC_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./data:/app/data
      - ${IC_REPOSITORIES_DIR:-.}:/repositories:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - temporal
