[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-copilot"
version = "0.1.0"
description = "Diagnosis-first incident copilot for containerized monorepos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.31",
  "networkx>=3.3",
]

[project.optional-dependencies]
guardrails = [
  "nemoguardrails==0.24.1",
]
codegraph = [
  "mcp==1.30.0",
  "sse-starlette>=2,<3",
]
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
]
temporal = [
  "temporalio>=1.6.0",
]
llm = [
  "langgraph>=1,<2",
  "langchain-core>=0.2.22",
]
agentic = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]
parsing = [
  "tree-sitter>=0.25.2,<0.27",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-json>=0.24.8",
  "tree-sitter-yaml>=0.7.2",
]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"incident_copilot.llm" = ["policies/*.yml", "policies/*.co", "policies/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
