# Opt in with both files: docker compose -f docker-compose.dev.yml -f docker-compose.litellm.yml up --build -d
services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:1.106.4@sha256:c169fb3adc514fcf210377c203f3de406d54f10bfdacf13948a4a839db9af7de}
    restart: unless-stopped
    init: true
    command: ["--config=/app/config.yaml", "--host=0.0.0.0", "--port=4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before enabling the LiteLLM overlay}
      LITELLM_MODEL: ${LITELLM_MODEL:-ollama_chat/llama3.1:8b}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://host.docker.internal:11434}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-ollama}
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    environment:
      IC_LLM_PROVIDER: openai_compatible
      IC_OPENAI_COMPATIBLE_BASE_URL: http://litellm:4000/v1
      IC_OPENAI_COMPATIBLE_MODEL: incident-diagnosis
      IC_OPENAI_COMPATIBLE_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before enabling the LiteLLM overlay}
    depends_on:
      litellm:
        condition: service_healthy

  worker:
    environment:
      IC_LLM_PROVIDER: openai_compatible
      IC_OPENAI_COMPATIBLE_BASE_URL: http://litellm:4000/v1
      IC_OPENAI_COMPATIBLE_MODEL: incident-diagnosis
      IC_OPENAI_COMPATIBLE_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env before enabling the LiteLLM overlay}
    depends_on:
      litellm:
        condition: service_healthy
